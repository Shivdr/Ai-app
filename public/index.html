<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna - AI Voice Chat</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="avatar-container">
          <div class="avatar" id="avatar">
            <span class="avatar-letter">L</span>
          </div>
          <span class="status-dot" id="statusDot"></span>
        </div>
        <div class="header-info">
          <h1 class="ai-name" id="aiName">Luna</h1>
          <p class="ai-status" id="aiStatus">Online</p>
        </div>
      </div>
      <div class="header-right">
        <div class="mood-badge" id="moodBadge">
          <span class="mood-emoji" id="moodEmoji">😊</span>
          <span class="mood-text" id="moodText">Happy</span>
        </div>
      </div>
    </header>

    <!-- Chat Messages -->
    <main class="chat-container" id="chatContainer">
      <div class="chat-messages" id="chatMessages">
        <!-- Welcome message -->
        <div class="date-divider">
          <span>Today</span>
        </div>
      </div>
    </main>

    <!-- Voice Visualizer (shown during voice chat) -->
    <div class="voice-visualizer" id="voiceVisualizer">
      <div class="visualizer-content">
        <div class="pulse-ring" id="pulseRing">
          <div class="pulse-avatar">
            <span>L</span>
          </div>
        </div>
        <p class="visualizer-status" id="visualizerStatus">Listening...</p>
        <p class="live-transcript" id="liveTranscript"></p>
      </div>
    </div>

    <!-- Input Area -->
    <footer class="input-area">
      <div class="input-container">
        <button class="btn-voice" id="btnVoice" title="Hold to talk">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <svg class="stop-icon hidden" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>
        <div class="text-input-wrap">
          <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off">
        </div>
        <button class="btn-send" id="btnSend" title="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Audio Player (hidden) -->
  <audio id="audioPlayer" style="display:none;"></audio>

  <script src="app.js"></script>
</body>
</html>
